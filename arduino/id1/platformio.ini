[env:genericSTM32F411CE]
platform = ststm32
board = genericSTM32F411CE
framework = arduino
upload_protocol = dfu
lib_deps = 
	gyverlibs/GyverIO@^1.3.13
	khoih-prog/STM32_TimerInterrupt@^1.3.0
